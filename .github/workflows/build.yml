name: ESP32 Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          update-environment: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0 python3-opencv
          python -m pip install --upgrade pip virtualenv

      - name: Set up ESP-IDF
        run: |
          # 确保pip可用
          python -m ensurepip --default-pip
          python -m pip install --upgrade pip

          # 设置环境变量
          export IDF_PYTHON_ENV_PATH=$HOME/.espressif/python_env
          mkdir -p $IDF_PYTHON_ENV_PATH

          # 安装ESP-IDF
          mkdir -p $HOME/esp
          cd $HOME/esp
          git clone --depth 1 --branch v5.1.1 https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh --prefer-system --no-shallow-clone esp32
        env:
          IDF_TOOLS_PATH: $HOME/.espressif

      - name: Prepare components
        run: |
          mkdir -p firmware/components
          cd firmware/components
          git clone https://github.com/espressif/esp32-camera.git esp32-camera
          git clone -b release/v1.0 https://github.com/espressif/esp-dl.git esp-dl
          git clone https://github.com/tensorflow/tflite-micro.git tflite-micro

      - name: Build project
        run: |
          source $HOME/esp/esp-idf/export.sh
          cd firmware
          idf.py set-target esp32
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults" -DPARTITION_TABLE_CSV_PATH="partitions.csv" build

      - name: Upload firmware binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
