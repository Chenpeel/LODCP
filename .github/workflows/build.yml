name: Build ESP32-CAM LODCP Firmware

on:
  push:
    branches: [main, master, dev]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4.3
          target: esp32

      - name: Setup components
        run: |
          mkdir -p firmware/components
          cd firmware/components
          # Clone necessary components
          git clone --recursive https://github.com/espressif/esp32-camera.git
          git clone --recursive https://github.com/espressif/esp-dl.git
          git clone --recursive https://github.com/espressif/tflite-micro-esp-examples.git tflite-micro
          cd tflite-micro
          bash setup.sh

      - name: Build firmware with ESP-IDF
        run: |
          cd firmware
          idf.py set-target esp32
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            firmware/build/lodcp.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/bootloader/bootloader.bin
          retention-days: 7

      - name: Create firmware bundle
        run: |
          mkdir -p firmware-bundle
          cp firmware/build/lodcp.bin firmware-bundle/
          cp firmware/build/partition_table/partition-table.bin firmware-bundle/
          cp firmware/build/bootloader/bootloader.bin firmware-bundle/
          cd firmware-bundle
          zip -r ../firmware-bundle.zip .
          cd ..

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle
          path: firmware-bundle.zip
          retention-days: 7
