name: Build ESP32-CAM LODCP Firmware

on:
  push:
    branches: [main, master, dev]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git wget unzip python3-pip
          pip install --upgrade pip

      - name: Setup components
        run: |
          mkdir -p firmware/components
          cd firmware/components

          # Clone ESP32 Camera
          git clone --recursive https://github.com/espressif/esp32-camera.git

          # Clone ESP-DL
          git clone --recursive https://github.com/espressif/esp-dl.git

          # Clone and setup TFLite-micro
          git clone --recursive https://github.com/espressif/tflite-micro-esp-examples.git tflite-micro
          cd tflite-micro

          # Check repository structure
          ls -la

          # Run the setup script if it exists
          if [ -f "setup.sh" ]; then
            chmod +x setup.sh
            ./setup.sh
          else
            echo "setup.sh not found. Trying alternative setup..."
            # Try to set up components manually
            if [ -d "components" ]; then
              echo "Found components directory, setting up..."
              cd components
              if [ -d "tflite-lib" ]; then
                echo "Found tflite-lib, no further setup needed"
              else
                echo "Error: tflite-lib not found"
              fi
            else
              echo "Error: components directory not found"
              # Create minimal structure to allow build to proceed
              mkdir -p components/tflite-lib
            fi
          fi

      - name: Build firmware with ESP-IDF
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32
          idf.py build

      - name: List build directory
        run: |
          ls -la firmware/build/ || echo "Build directory not found"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            firmware/build/*.bin
            firmware/build/partition_table/*.bin
            firmware/build/bootloader/*.bin
          if-no-files-found: warn
          retention-days: 7

      - name: Create firmware bundle
        run: |
          mkdir -p firmware-bundle
          find firmware/build -name "*.bin" -exec cp {} firmware-bundle/ \; || echo "No .bin files found"
          find firmware/build/partition_table -name "*.bin" -exec cp {} firmware-bundle/ \; || echo "No partition table .bin files found"
          find firmware/build/bootloader -name "*.bin" -exec cp {} firmware-bundle/ \; || echo "No bootloader .bin files found"

          if [ "$(ls -A firmware-bundle)" ]; then
            zip -r firmware-bundle.zip firmware-bundle/
          else
            echo "No firmware files found to bundle"
            exit 1
          fi

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle
          path: firmware-bundle.zip
          if-no-files-found: warn
          retention-days: 7
