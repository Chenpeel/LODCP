name: ESP32 Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 设置 ESP-IDF 环境
      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 安装依赖
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv
          mkdir -p firmware/components
          git clone https://github.com/espressif/esp32-camera.git firmware/components/esp32-camera
          git clone --recursive https://github.com/espressif/esp-tflite-micro.git firmware/components/tflite-lib
          git clone https://github.com/espressif/esp-dl.git firmware/components/esp-dl

      # 编译项目
      - name: Build project
        working-directory: ${{ github.workspace }}
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py build

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: firmware/build/
