name: ESP32 Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 手动安装 ESP-IDF
      - name: Install ESP-IDF
        run: |
          mkdir -p $HOME/esp
          cd $HOME/esp
          git clone https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32
          echo "IDF_PATH=$HOME/esp/esp-idf" >> $GITHUB_ENV

      # 检查项目结构并纠错
      - name: Check project structure
        run: |
          echo "当前工作目录: $(pwd)"
          echo "项目结构:"
          ls -la

      # 安装依赖并正确设置组件
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv

          # 创建组件目录
          mkdir -p firmware/components
          cd firmware/components

          # 克隆所需组件
          echo "克隆 ESP32-Camera 组件..."
          git clone https://github.com/espressif/esp32-camera.git esp32-camera

          echo "克隆 ESP-DL 组件..."
          git clone -b release/v1.0 https://github.com/espressif/esp-dl.git esp-dl

          echo "克隆 TFLite-Micro 组件..."
          git clone https://github.com/tensorflow/tflite-micro.git  tflite-micro

          # 回到固件目录
          cd ../

          # 显示组件结构
          echo "组件目录结构:"
          ls -la components/

      # 修复源代码和CMakeLists.txt
      - name: Fix build files
        run: |
          # 确保main目录存在
          if [ ! -d "firmware/main" ]; then
            echo "Error: firmware/main directory not found!"
            exit 1
          fi

      # 编译项目
      - name: Build project
        run: |
          source $HOME/esp/esp-idf/export.sh
          cd firmware
          export IDF_TARGET=esp32
          cat > sdkconfig.defaults << EOF
          CONFIG_ESP32_SPIRAM_SUPPORT=y
          CONFIG_CAMERA_SUPPORT=y
          CONFIG_CAMERA_MODEL_ESP_EYE=n
          CONFIG_CAMERA_MODEL_M5STACK_PSRAM=n
          CONFIG_CAMERA_MODEL_AI_THINKER=y
          EOF

          # 列出所有文件和目录，帮助调试
          echo "固件目录结构:"
          ls -la

          echo "组件目录结构:"
          ls -la components/
          ls -la components/tflite-micro
          ls -la components/esp-dl
          ls -la components/esp32-camera

          echo "主目录结构:"
          ls -la main/

          echo "包含目录结构:"
          ls -la include/

          # 运行构建
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults" \
          -DPARTITION_TABLE_CSV_PATH="partitions.csv" \
          set-target esp32

          idf.py build

      # 保存构建日志
      - name: Save build logs
        if: always()
        run: |
          mkdir -p /tmp/build_logs

          if [ -d firmware/build ]; then
            cp -r firmware/build/log /tmp/build_logs || echo "No build logs found"

            if [ -f firmware/build/CMakeFiles/CMakeError.log ]; then
              cp firmware/build/CMakeFiles/CMakeError.log /tmp/build_logs/
            fi

            if [ -f firmware/build/CMakeFiles/CMakeOutput.log ]; then
              cp firmware/build/CMakeFiles/CMakeOutput.log /tmp/build_logs/
            fi

            echo "Build logs saved to /tmp/build_logs"
          else
            echo "Build directory not found"
          fi
