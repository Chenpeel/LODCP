name: Build ESP32-CAM LODCP Firmware

on:
  push:
    branches: [main, master, dev]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git wget unzip python3-pip
          pip install --upgrade pip

      - name: Setup components
        run: |
          mkdir -p firmware/components
          cd firmware/components
          # Clone necessary components
          git clone --recursive https://github.com/espressif/esp32-camera.git
          git clone --recursive https://github.com/espressif/esp-dl.git
          git clone --recursive https://github.com/espressif/tflite-micro-esp-examples.git tflite-micro
          cd tflite-micro
          ./tensorflow/lite/micro/tools/ci_build/test_x86.sh

      - name: Build firmware with ESP-IDF
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32
          idf.py build

      - name: List build directory
        run: |
          ls -la firmware/build/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            firmware/build/*.bin
            firmware/build/partition_table/*.bin
            firmware/build/bootloader/*.bin
          retention-days: 7

      - name: Create firmware bundle
        run: |
          mkdir -p firmware-bundle
          cp firmware/build/*.bin firmware-bundle/ || true
          cp firmware/build/partition_table/*.bin firmware-bundle/ || true
          cp firmware/build/bootloader/*.bin firmware-bundle/ || true
          zip -r firmware-bundle.zip firmware-bundle/

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle
          path: firmware-bundle.zip
          retention-days: 7
