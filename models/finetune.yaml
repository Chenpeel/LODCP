lr0: 0.001       # 初始学习率
lrf: 0.01        # 最终学习率 (cosine衰减)
momentum: 0.937   # SGD动量参数
weight_decay: 0.0005  # 权重衰减
warmup_epochs: 5  # 热身epochs
warmup_momentum: 0.8  # 热身阶段动量
warmup_bias_lr: 0.1  # 热身阶段偏置学习率
box: 0.05        # box损失增益
cls: 0.3         # 分类损失增益
obj: 0.7         # 目标损失增益
hsv_h: 0.015     # 色调增强
hsv_s: 0.7       # 饱和度增强
hsv_v: 0.4       # 明度增强
degrees: 0.0     # 旋转角度
translate: 0.1   # 平移增强
scale: 0.5       # 缩放增强
shear: 0.0       # 剪切增强
perspective: 0.0 # 透视增强
flipud: 0.0      # 上下翻转概率
fliplr: 0.5      # 左右翻转概率
mosaic: 1.0      # mosaic增强概率
mixup: 0.0       # mixup增强概率
